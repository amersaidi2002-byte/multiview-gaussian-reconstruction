[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-gaussian-reconstruction"
version = "0.1.0"
description = "Train-only triangulation and CPU Gaussian splatting for calibrated multi-view images"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<4.12",
    "pillow>=10,<13",
    "pycolmap>=4.0,<5",
    "torch>=2.5,<3",
]

[project.scripts]
multiview3d = "multiview3d.benchmark:main"
multiview3d-preview = "multiview3d.preview:main"

[tool.setuptools.packages.find]
where = ["src"]
